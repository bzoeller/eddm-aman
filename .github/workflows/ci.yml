# Tests bei jedem Push und Pull Request (Linux, ohne EuroScope-SDK); der Release-Workflow ruft sie auch auf
name: Tests
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright und Chromium installieren
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Rechenkern und Browser
        run: npm test
      - name: Plugin (mit Nachbau der EuroScope-Schnittstelle) und Plugin-Update
        run: npm run test:plugin
